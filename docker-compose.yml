version: '3.8'
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://redis:6379
      - WORKER_URL=http://worker:8000
    depends_on:
      - redis
      - worker

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "8000:8000"
    environment:
      - WORKER_ID=worker-1

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
